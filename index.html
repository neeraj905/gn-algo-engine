<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Studio - Character & Prompt Editor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        h2 {
            color: #38bdf8;
            text-align: center;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #cbd5e1;
        }
        input[type="file"], textarea, select {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            color: #fff;
            border: 1px solid #475569;
            border-radius: 6px;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>AI Video & Face Studio</h2>
        <form action="/api/comment-to-video" method="post" enctype="multipart/form-data">
            
            <div class="form-group">
                <label>1. Upload Song / Video File:</label>
                <input type="file" name="video" accept="video/*" required>
            </div>
            
            <div class="form-group">
                <label>2. Upload Target Face Photo (Girl/Boy):</label>
                <input type="file" name="target_face" accept="image/*" required>
            </div>
            
            <div class="form-group">
                <label>3. AI Character Comment / Prompt:</label>
                <textarea name="comment_text" rows="3" placeholder="E.g., Same running movement, change dress, say: Hello!" required></textarea>
            </div>

            <div class="form-group">
                <label>4. Character Gender:</label>
                <select name="target_gender">
                    <option value="female">Female (Ladki)</option>
                    <option value="male">Male (Ladka)</option>
                </select>
            </div>
            
            <button type="submit">🚀 Run AI Pipeline & Generate</button>
        </form>
    </div>

</body>
    </html>
