<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KING SHIELD ULTRA v2.0</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; }
        .master-box { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .menu-btn { font-size: 24px; color: #2ea44f; background: none; border: none; cursor: pointer; float: left; }
        .sidebar { height: 100%; width: 0; position: fixed; z-index: 9999; top: 0; left: 0; background-color: #161b22; overflow-x: hidden; transition: 0.3s; padding-top: 60px; border-right: 1px solid #30363d; }
        .sidebar a { padding: 15px 25px; text-decoration: none; font-size: 18px; color: #c9d1d9; display: block; font-weight: bold; }
        .sidebar a:hover { background-color: #21262d; color: #58a6ff; }
        .sidebar .closebtn { position: absolute; top: 10px; right: 25px; font-size: 36px; color: #f85149; }
        .nav-toggle-btn { background: #21262d; border: 1px solid #30363d; padding: 10px; border-radius: 6px; color: #fff; font-weight: bold; }
        .active-tab { background: #2ea44f !important; border-color: #2ea44f !important; }
        .stat-grid { background: #0d1117; border: 1px solid #21262d; border-radius: 6px; padding: 15px; }

        /* 🎛️ असली विजुअल टॉगल स्विच की स्टाइलिंग */
        .toggle-container { display: flex; align-items: center; justify-content: space-between; background: #0d1117; border: 1px solid #30363d; border-radius: 50px; padding: 10px 25px; cursor: pointer; user-select: none; transition: all 0.3s ease; }
        .toggle-label { font-size: 1.1rem; font-weight: bold; letter-spacing: 0.5px; }
        
        .switch-track { width: 70px; height: 34px; background: #21262d; border-radius: 20px; position: relative; border: 1px solid #30363d; transition: 0.3s; }
        .switch-nob { width: 26px; height: 26px; background: #8b949e; border-radius: 50px; position: absolute; top: 3px; left: 4px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: white; transition: 0.3s; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        
        /* ON स्टेट का लुक */
        .status-on .switch-track { background: rgba(46, 164, 79, 0.15); border-color: #2ea44f; }
        .status-on .switch-nob { left: 38px; background: #2ea44f; box-shadow: 0 0 10px #2ea44f; }
        .status-on .toggle-label { color: #2ea44f; }

        /* OFF स्टेट का लुक */
        .status-off .switch-track { background: rgba(218, 54, 55, 0.15); border-color: #da3637; }
        .status-off .switch-nob { left: 4px; background: #da3637; box-shadow: 0 0 10px #da3637; }
        .status-off .toggle-label { color: #da3637; }
    </style>
</head>
<body>

<div id="kingSidebar" class="sidebar">
    <a href="javascript:void(0)" class="closebtn" onclick="closeKingMenu()">&times;</a>
    <a href="/">📊 मुख्य लाइव चार्ट्स</a>
    <a href="/paper-trading">📈 लाइव पेपर ट्रेडिंग (₹3000)</a>
</div>

<div class="container my-3">
    <!-- 🛡️ टॉप हेडर बेल्ट -->
    <div class="d-flex align-items-center justify-content-between mb-4">
        <button class="menu-btn" onclick="openKingMenu()">☰</button>
        <h4 class="m-0 fw-bold text-white">🤖 KING SHIELD ULTRA v2.0</h4>
        <span class="badge bg-success">● DEMO MODE ACTIVE</span>
    </div>

    <!-- 🎛️ MASTER ON/OFF TOGGLE SWITCH -->
    <div class="master-box py-3">
        <div id="robot-toggle-row" class="toggle-container status-on" onclick="handleToggleClick()">
            <span id="toggle-text" class="toggle-label">⚡ ROBOT STATUS: ACTIVE (ON)</span>
            <div class="switch-track">
                <div id="switch-circle" class="switch-nob">ON</div>
            </div>
        </div>
    </div>

    <!-- 📊 असली 3-कॉलग ग्रिड डैशबोर्ड -->
    <div class="master-box">
        <div class="row text-center g-2">
            <div class="col-4">
                <div class="stat-grid">
                    <small class="text-secondary d-block">Starting Capital:</small>
                    <span class="fw-bold text-primary fs-6">₹3000.00</span>
                </div>
            </div>
            <div class="col-4">
                <div class="stat-grid">
                    <small class="text-secondary d-block">Today's P&L:</small>
                    <span id="live-pnl" class="fw-bold text-success fs-6">₹0.00</span>
                </div>
            </div>
            <div class="col-4">
                <div class="stat-grid">
                    <small class="text-secondary d-block">Current Balance:</small>
                    <span id="live-balance" class="fw-bold text-success fs-6">₹3000.00</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 📋 आदेशों की असली लाइव ग्रिड टेबल -->
    <div class="master-box p-0 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-dark table-striped m-0 align-middle text-center" style="border-collapse: collapse;">
                <thead>
                    <tr class="text-success" style="border-bottom: 2px solid #30363d;">
                        <th class="py-3">Time</th>
                        <th class="py-3">Index Name</th>
                        <th class="py-3">Order Type</th>
                        <th class="py-3">Shares</th>
                        <th class="py-3">Price</th>
                        <th class="py-3">Amount</th>
                    </tr>
                </thead>
                <tbody id="live-orders-body">
                    <tr>
                        <td colspan="6" class="py-5 text-secondary fs-6">डेटा पाइपलाइन कनेक्ट हो रही है...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
function openKingMenu() { document.getElementById("kingSidebar").style.width = "260px"; }
function closeKingMenu() { document.getElementById("kingSidebar").style.width = "0"; }

let robotActive = true; 

// 🎛️ क्लिक करने पर स्विच को विजुअली खिसकाने और बदलने का लॉजिक
function handleToggleClick() {
    let row = document.getElementById("robot-toggle-row");
    let text = document.getElementById("toggle-text");
    let circle = document.getElementById("switch-circle");
    
    if (robotActive) {
        robotActive = false;
        row.className = "toggle-container status-off";
        text.innerHTML = "🛑 ROBOT STATUS: PAUSED (OFF)";
        circle.innerHTML = "OFF";
    } else {
        robotActive = true;
        row.className = "toggle-container status-on";
        text.innerHTML = "⚡ ROBOT STATUS: ACTIVE (ON)";
        circle.innerHTML = "ON";
    }
}

// 🔄 लाइव डेमो इंजन (केवल तभी काम करेगा जब रोबोट ON होगा)
setInterval(function() {
    if (!robotActive) return; 
    
    let baseCapital = 3000;
    let randomPnl = (Math.random() * 500 - 150).toFixed(2); 
    let currentBalance = (baseCapital + parseFloat(randomPnl)).toFixed(2);
    
    let pnlElement = document.getElementById("live-pnl");
    let balElement = document.getElementById("live-balance");
    
    if (randomPnl >= 0) {
        pnlElement.innerHTML = "₹" + randomPnl;
        pnlElement.className = "fw-bold text-success fs-6";
        balElement.className = "fw-bold text-success fs-6";
    } else {
        pnlElement.innerHTML = "-₹" + Math.abs(randomPnl);
        pnlElement.className = "fw-bold text-danger fs-6";
        balElement.className = "fw-bold text-danger fs-6";
    }
    balElement.innerHTML = "₹" + currentBalance;

    let now = new Date().toLocaleTimeString();
    let orderBody = document.getElementById("live-orders-body");
    orderBody.innerHTML = `
        <tr>
            <td>${now}</td>
            <td class="text-info fw-bold">NIFTY 50</td>
            <td><span class="badge bg-success">BUY</span></td>
            <td>50</td>
            <td>₹24,250.00</td>
            <td class="text-success fw-bold">₹3,000.00</td>
        </tr>
    `;
}, 2000);
</script>

</body>
                    </html>
